    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
    "alembic>=1.14,<2",
    "argon2-cffi>=25.1,<26",
    "PyJWT>=2.10,<3",
]